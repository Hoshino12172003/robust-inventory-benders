candidate_name: certified_adaptive_multicut_fair_benders
candidate_schema: 1
components:
  certified_initial_t1_upper_bound: true
  persistent_separation_model_structure: true
  pattern_only_certified_cache: true
  adaptive_certified_multicut_selection: true
forbidden:
  cut_deletion: true
  old_ray_reuse: true
  old_cut_reuse: true
  old_violation_reuse: true
  old_certification_reuse: true
certification:
  success_status: certified_robust_optimal
  fixed_scenario_recertification_at_current_point: true
  full_separation_objective_bound_required: true
canonical_identity:
  unicode_normalization: NFC
  json_serialization: {sort_keys: true, separators: [",", ":"], ensure_ascii: false, allow_nan: false, encoding: utf-8, trailing_newline: false}
  sha256_hex_case: upper
  pattern:
    schema: fairness_deviation_pattern_v1
    component_order: instance_R_major_then_instance_J_minor
    allowed_values: [0, 1]
    invalid_length_or_value: fail_closed
  cut:
    schema: fairness_farkas_cut_v1
    variable_order: [y_by_instance_I, x_by_instance_I_then_J, T]
    coefficient_encoding: python_float_hex_binary64
    signed_zero: canonical_positive_zero
    nonfinite: fail_closed
    includes: [schema, farkas_normalization, sense, canonical_variable_ids, coefficients, constant, rhs]
    farkas_normalization: nonnegative_multipliers_sum_to_one_v1
numeric_selection:
  quantization_schema: binary64_integer_ratio_round_half_even_v2
  implementation: binary64_as_integer_ratio_arbitrary_precision_integer
  rounding_mode: ROUND_HALF_EVEN
  quantum_rational: {numerator: 1, denominator: 1000000000}
  raw_violation_acceptance_tolerance: 1.0e-7
  raw_violation_quantum: 1.0e-9
  normalized_violation_quantum: 1.0e-9
  relative_violation_quantum: 1.0e-9
  cosine_similarity_quantum: 1.0e-9
  diversity_quantum: 1.0e-9
  lb_improvement_quantum: 1.0e-9
  threshold_deadband_buckets: 2
  relative_violation_threshold: 0.10
  cosine_redundancy_threshold: 0.98
  violation_deadband_policy: reject_or_do_not_promote
  cosine_deadband_policy: redundant
  signed_zero: canonical_positive_zero
  nonfinite: fail_closed
  fail_closed_states:
    - nonfinite_numeric_identity
    - invalid_quantum
    - invalid_binary64_input
    - quantization_schema_mismatch
  lb_improvement_state: quantized_max_0_current_LB_minus_previous_LB
  stall_counter: consecutive_zero_lb_improvement_buckets_reporting_only
adaptive_multicut:
  minimum_cuts_when_a_certified_violation_exists: 1
  maximum_certified_cuts_per_iteration: 5
  coefficient_order: [y, x, T]
  normalized_violation_denominator: max(1,l1_norm_of_cut_coefficients)
  direction_similarity: cosine_of_l2_normalized_coefficient_vectors
  selection_order:
    - quantized_normalized_violation_descending
    - quantized_diversity_descending
    - quantized_raw_violation_descending
    - pattern_sha256_ascending
    - cut_sha256_ascending
  adaptive_batch_schedule:
    - {condition: final_certification, maximum_batch_size: 1}
    - {if_total_committed_unique_master_cuts_lt: 1000, maximum_batch_size: 5}
    - {if_total_committed_unique_master_cuts_lt: 3000, maximum_batch_size: 3}
    - {if_total_committed_unique_master_cuts_lt: 5000, maximum_batch_size: 2}
    - {otherwise: true, maximum_batch_size: 1}
  schedule_count_field: total_committed_unique_master_cuts
  schedule_count_timing: start_of_iteration_before_selection
  selected_count_formula: A_k=min(E_k,B(C_k))
  committed_count_includes: [unique_valid_cuts_actually_added_to_master_and_atomically_checkpointed_before_iteration]
  committed_count_excludes:
    - certified_but_not_selected
    - selected_but_not_committed
    - duplicate
    - numerical_redundancy_rejection
    - invalid_or_uncertified
    - pool_candidate
    - cache_candidate
  runtime_fields_role: reporting_only_never_scientific_branching
  schedule_must_not_be_retuned_from_L0_L1_M1_or_holdout: true
checkpointed_adaptive_state:
  - iteration
  - total_committed_unique_master_cuts
  - final_certification
  - current_batch_schedule_segment
  - quantized_lb_improvement_state
  - stall_counter
  - pattern_sha256_values
  - candidate_ordering
  - duplicate_and_redundancy_decisions
  - selected_cut_sha256_values
  - committed_master_cut_sha256_values
  - committed_cut_count_before_iteration
  - committed_cut_count_after_iteration
  - cut_commit_state
  - canonical_cut_payloads_by_sha256
  - pattern_schema_version
  - cut_schema_version
  - quantization_schema
  - quantization_identity
cut_commit_state_machine:
  states: [no_selection, selection_complete_not_committed, commit_complete]
  committed_list: append_only_unique_in_successful_commit_order
  checkpoint_identity_covers: [selected_cut_sha256_values, committed_master_cut_sha256_values, committed_cut_count_before_iteration, committed_cut_count_after_iteration, cut_commit_state]
  selection_checkpoint: atomic_before_any_master_add
  commit_checkpoint: atomic_after_all_selected_master_adds
  partial_commit_checkpoint: forbidden
  memory_add_without_commit_checkpoint: volatile_and_scientifically_invisible
  resume_duplicate_prevention: rebuild_from_persisted_committed_list_and_never_add_existing_sha
  selected_payload_reconstruction: canonical_cut_payloads_by_sha256
  corrupt_duplicate_count_or_relation: fail_closed
  deprecated_cut_sha256_values: forbidden_not_a_recovery_source
manifest_identity_includes:
  - candidate_file_sha256
  - pattern_schema
  - cut_schema
  - canonical_json_rule
  - float_encoding_rule
  - quantization_parameters
  - quantization_schema
  - adaptive_batch_schedule
  - committed_cut_state_machine
  - checkpoint_selection_state
